<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">骷髅牌原创中性卡牌组件模型</title>
  <desc id="desc">展示花牌、骷髅牌、统一牌背和公开的最后机会牌，不使用官方美术。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17191d"/>
      <stop offset="1" stop-color="#282d33"/>
    </linearGradient>
    <radialGradient id="disc" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#4a4642"/>
      <stop offset="0.72" stop-color="#2d2a29"/>
      <stop offset="1" stop-color="#1f1e1d"/>
    </radialGradient>
    <radialGradient id="publicDisc" cx="38%" cy="28%" r="72%">
      <stop offset="0" stop-color="#eee6d3"/>
      <stop offset="0.72" stop-color="#d7c7a7"/>
      <stop offset="1" stop-color="#ad9670"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <g id="flowerIcon">
      <g fill="#d6c9b7" stroke="#f0e8dc" stroke-width="2">
        <ellipse cx="0" cy="-42" rx="23" ry="38"/>
        <ellipse cx="39.94" cy="-12.98" rx="23" ry="38" transform="rotate(72 39.94 -12.98)"/>
        <ellipse cx="24.69" cy="33.98" rx="23" ry="38" transform="rotate(144 24.69 33.98)"/>
        <ellipse cx="-24.69" cy="33.98" rx="23" ry="38" transform="rotate(216 -24.69 33.98)"/>
        <ellipse cx="-39.94" cy="-12.98" rx="23" ry="38" transform="rotate(288 -39.94 -12.98)"/>
      </g>
      <circle r="24" fill="#b88a51" stroke="#ead2a3" stroke-width="4"/>
      <circle r="8" fill="#3b332a"/>
    </g>
    <g id="skullIcon">
      <path d="M-55 2c0-50 25-78 55-78S55-48 55 2c0 28-12 42-28 50v27H-27V52C-43 44-55 30-55 2Z" fill="#d8cec0" stroke="#f1e9df" stroke-width="4"/>
      <ellipse cx="-22" cy="3" rx="16" ry="20" fill="#292725"/>
      <ellipse cx="22" cy="3" rx="16" ry="20" fill="#292725"/>
      <path d="M0 18l-9 17h18Z" fill="#292725"/>
      <path d="M-26 54h52M-18 54v22M-6 54v22M6 54v22M18 54v22" stroke="#292725" stroke-width="6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="720" rx="40" fill="url(#bg)"/>
  <circle cx="1030" cy="70" r="180" fill="#c86b56" opacity=".08" filter="url(#soft)"/>
  <circle cx="170" cy="680" r="230" fill="#d0a85c" opacity=".06" filter="url(#soft)"/>

  <text x="70" y="78" fill="#f4efe8" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700">卡牌组件语义模型</text>
  <text x="70" y="116" fill="#aeb4bb" font-family="Microsoft YaHei, sans-serif" font-size="17">原创中性占位设计 · 圆牌直径 88 逻辑单位 · 图形与文字双重识别</text>

  <g transform="translate(188 318)" filter="url(#shadow)">
    <circle r="130" fill="url(#disc)" stroke="#a89482" stroke-width="10"/>
    <circle r="112" fill="none" stroke="#6e9e7b" stroke-width="3" stroke-dasharray="5 8" opacity=".8"/>
    <use href="#flowerIcon"/>
  </g>
  <text x="188" y="492" text-anchor="middle" fill="#f4efe8" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700">花牌</text>
  <text x="188" y="525" text-anchor="middle" fill="#9ca7a0" font-family="Microsoft YaHei, sans-serif" font-size="16">安全 · 翻开后继续挑战</text>

  <g transform="translate(465 318)" filter="url(#shadow)">
    <circle r="130" fill="url(#disc)" stroke="#a89482" stroke-width="10"/>
    <circle r="112" fill="none" stroke="#b45f5f" stroke-width="3" stroke-dasharray="5 8" opacity=".9"/>
    <use href="#skullIcon"/>
  </g>
  <text x="465" y="492" text-anchor="middle" fill="#f4efe8" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700">骷髅牌</text>
  <text x="465" y="525" text-anchor="middle" fill="#bda0a0" font-family="Microsoft YaHei, sans-serif" font-size="16">危险 · 翻开即停止并处罚</text>

  <g transform="translate(742 318)" filter="url(#shadow)">
    <circle r="130" fill="url(#disc)" stroke="#c86b56" stroke-width="10"/>
    <circle r="104" fill="none" stroke="#8e8075" stroke-width="2"/>
    <circle r="78" fill="none" stroke="#c86b56" stroke-width="5" stroke-dasharray="2 12" stroke-linecap="round"/>
    <path d="M-48 0h96M0-48v96M-34-34l68 68M34-34l-68 68" stroke="#b6a89b" stroke-width="7" stroke-linecap="round" opacity=".72"/>
    <circle r="23" fill="#c86b56"/>
    <circle r="9" fill="#282422"/>
  </g>
  <text x="742" y="492" text-anchor="middle" fill="#f4efe8" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700">统一牌背</text>
  <text x="742" y="525" text-anchor="middle" fill="#aaa7a3" font-family="Microsoft YaHei, sans-serif" font-size="16">同一玩家套牌内完全一致</text>

  <g transform="translate(1019 318)" filter="url(#shadow)">
    <circle r="130" fill="url(#publicDisc)" stroke="#f0d8a4" stroke-width="10"/>
    <circle r="111" fill="none" stroke="#6e9e7b" stroke-width="6"/>
    <g transform="scale(.9)"><use href="#flowerIcon"/></g>
    <rect x="-70" y="73" width="140" height="34" rx="17" fill="#2c332d" opacity=".92"/>
    <text x="0" y="96" text-anchor="middle" fill="#f2eadc" font-family="Microsoft YaHei, sans-serif" font-size="15" font-weight="700">公开安全牌</text>
  </g>
  <text x="1019" y="492" text-anchor="middle" fill="#f4efe8" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700">最后机会牌</text>
  <text x="1019" y="525" text-anchor="middle" fill="#b9b29f" font-family="Microsoft YaHei, sans-serif" font-size="16">仅下一轮 · 所有人知道是花</text>

  <g transform="translate(72 593)">
    <rect width="1056" height="72" rx="18" fill="#ffffff" opacity=".045" stroke="#ffffff" stroke-opacity=".1"/>
    <circle cx="36" cy="36" r="8" fill="#6e9e7b"/>
    <text x="56" y="42" fill="#c9d0d4" font-family="Microsoft YaHei, sans-serif" font-size="16">花与骷髅必须同时使用轮廓、文字和读屏标签；颜色只作辅助。</text>
    <circle cx="690" cy="36" r="8" fill="#d0a85c"/>
    <text x="710" y="42" fill="#c9d0d4" font-family="Microsoft YaHei, sans-serif" font-size="16">本图不复刻官方牌面，可安全用作实现占位。</text>
  </g>
</svg>
