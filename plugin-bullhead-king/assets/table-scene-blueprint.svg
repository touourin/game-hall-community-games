<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" data-model-version="1" role="img" aria-labelledby="title desc">
  <title id="title">谁是牛头王牌桌场景蓝图</title>
  <desc id="desc">包括玩家计分轨、同时揭示轨、四条五卡行和底部私有手牌区。</desc>
  <style>
