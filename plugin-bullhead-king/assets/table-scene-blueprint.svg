    .hint { font: 500 14px 'Microsoft YaHei', sans-serif; fill: #89aaa4; }
    .zone { fill: #0c3437; stroke: #ba8b3f; stroke-width: 2; }
    .slot { fill: #f8f0dd; fill-opacity: .08; stroke: #7fa099; stroke-width: 2; stroke-dasharray: 7 6; }
  </style>
